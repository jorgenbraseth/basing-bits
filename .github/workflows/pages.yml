name: Check Bonefield Forge

# GitHub Pages serves this repo straight from the main branch, so the built
# web/index.html must be committed. This check fails if it is out of date
# with web/src/, and builds every model once as a smoke test.

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['web/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: index.html is up to date with src/
        run: |
          python3 web/build.py
          git diff --exit-code -- web/index.html || { echo "::error::web/index.html is stale. Run 'python3 web/build.py' and commit it."; exit 1; }

      - name: Smoke test the generator
        run: node web/test/check.js 7 0.5
