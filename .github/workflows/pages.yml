name: Build and deploy Bonefield Forge

# Builds web/index.html from web/src/ (gen.js + page.html), smoke-tests every
# model, and publishes the page to GitHub Pages.
# Requires Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build index.html from src/
        run: python3 web/build.py

      - name: Smoke test the generator
        run: node web/test/check.js 7 0.5

      - name: Collect site
        run: |
          mkdir -p _site
          cp web/index.html _site/index.html
          touch _site/.nojekyll

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
