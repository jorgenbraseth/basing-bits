<text x="26" y="33" font-size="3.2" fill="#5b6b7c">Warhammer 40,000 11th edition, Battlefields: Armageddon. 1:1 scale in mm, third-angle projection.</text>
<text x="26" y="240.00" font-size="3" fill="#5b6b7c">Dense. Plan size measured; height estimated from sprue photos (one ribbed cylinder is about 67 mm long).</text>
<text x="26" y="246.00" font-size="3" fill="#5b6b7c">Two ribbed capacitor cylinders joined by a riveted coupling, conductor heads on top. The cogitator and servitor</text>
<text x="26" y="252.00" font-size="3" fill="#5b6b7c">add-on (not drawn, 38 x 69 mm in plan) clips to one side in some layouts.</text>
<text x="26" y="258.00" font-size="3" fill="#5b6b7c">Sizes without ~ are measured off GW's to-scale Event Companion layouts (+/-4 mm) or set by the rules. ~ means estimated from photos (+/-15%).</text>
