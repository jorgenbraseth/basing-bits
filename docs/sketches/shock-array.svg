<text x="26" y="236.00" font-size="3" fill="#5b6b7c">Three skull-ring emitter posts on a riveted base beam with triangular feet; sculpted lightning arcs between the rings.</text>
<text x="26" y="242.00" font-size="3" fill="#5b6b7c">Sizes without ~ are measured off GW's to-scale Event Companion layouts (+/-4 mm) or set by the rules. ~ means estimated from photos (+/-15%).</text>
