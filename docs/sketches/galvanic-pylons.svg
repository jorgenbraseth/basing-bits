<text x="26" y="33" font-size="3.2" fill="#5b6b7c">Warhammer 40,000 11th edition, Battlefields: Armageddon. 1:1 scale in mm, third-angle projection.</text>
<text x="26" y="249.00" font-size="3" fill="#5b6b7c">Dense. Plan size measured (as drawn in the Event Companion layouts); height estimated from a photo of the full table.</text>
<text x="26" y="255.00" font-size="3" fill="#5b6b7c">Y-frame pylons carry three sagging cable bundles; the run ends in a ribbed end cap or plugs into the Generator Shrine.</text>
<text x="26" y="261.00" font-size="3" fill="#5b6b7c">The identification of this piece on the layout diagrams is inferred from counts and sprue photos.</text>
<text x="26" y="267.00" font-size="3" fill="#5b6b7c">Sizes without ~ are measured off GW's to-scale Event Companion layouts (+/-4 mm) or set by the rules. ~ means estimated from photos (+/-15%).</text>
