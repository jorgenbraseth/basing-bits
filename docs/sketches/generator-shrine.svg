<text x="26" y="33" font-size="3.2" fill="#5b6b7c">Warhammer 40,000 11th edition, Battlefields: Armageddon. 1:1 scale in mm, third-angle projection.</text>
<text x="26" y="287.00" font-size="3" fill="#5b6b7c">Dense. Plan size measured; height estimated from a photo of the full table (+/-20%).</text>
<text x="26" y="293.00" font-size="3" fill="#5b6b7c">Domed generator drum between two Y-shaped riveted side frames (the same frames as the pylons), Imperial aquila on top.</text>
<text x="26" y="299.00" font-size="3" fill="#5b6b7c">Pylon cables plug into the side frames.</text>
<text x="26" y="305.00" font-size="3" fill="#5b6b7c">Sizes without ~ are measured off GW's to-scale Event Companion layouts (+/-4 mm) or set by the rules. ~ means estimated from photos (+/-15%).</text>
